name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Apple resource previews
        run: python3 scripts/download-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install responsive test browsers
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
      - name: Check mobile layouts in Chromium and WebKit
        run: node scripts/check-responsive.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: responsive-screenshots
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
